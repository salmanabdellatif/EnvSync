name: Deploy API

on:
  push:
    branches: [master]
    paths:
      - "apps/api/**"
      - "Dockerfile"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch: # allows running the deploy manually from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: envsync-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase Repo Owner
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Build and Push
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # :latest for convenience, :<commit-sha> so every deploy is traceable and can be rolled back
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 4. Deploy to Oracle Cloud VPS (Caddy on the server proxies api.envsync.tech -> 127.0.0.1:3000)
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
          FULL_IMAGE: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ENV_PRODUCTION,FULL_IMAGE,GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            mkdir -p ~/envsync && cd ~/envsync

            # Env file readable only by the ubuntu user
            umask 077
            printf '%s\n' "$ENV_PRODUCTION" > .env.production

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker pull "$FULL_IMAGE"
            docker logout ghcr.io

            docker stop envsync-api || true
            docker rm envsync-api || true

            # Bound to localhost only (reachable through Caddy, not directly from the internet).
            # Memory cap keeps a leak from freezing the 1 GB VM; --restart brings it back.
            docker run -d \
              --name envsync-api \
              --restart unless-stopped \
              --env-file .env.production \
              -p 127.0.0.1:3000:3000 \
              --memory=400m \
              "$FULL_IMAGE"

            # Fail the deploy if the API doesn't come up
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3000/api/v1/health > /dev/null 2>&1; then
                echo "API is healthy"
                docker image prune -af
                exit 0
              fi
              sleep 2
            done
            echo "API did not become healthy. Last logs:"
            docker logs --tail 50 envsync-api
            exit 1
